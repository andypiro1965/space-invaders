<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Space Invaders</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;color:#9f9;font-family:"Courier New",monospace;overflow:hidden;touch-action:none}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
  canvas{background:#000;border:2px solid #1a3;image-rendering:pixelated;max-width:100vw;max-height:80vh;aspect-ratio:3/4;height:auto}
  #help{margin-top:8px;font-size:13px;opacity:.8;text-align:center}
  #touch{display:none;gap:10px;margin-top:10px}
  #touch button{font:bold 22px monospace;width:84px;height:56px;background:#112;color:#9f9;border:2px solid #1a3;border-radius:10px}
  @media (pointer:coarse){#touch{display:flex}#help{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="360" height="480"></canvas>
  <div id="help">← → muovi · SPAZIO spara · P pausa · INVIO riavvia</div>
  <div id="touch">
    <button id="bl">◀</button><button id="bf">FIRE</button><button id="br">▶</button>
  </div>
</div>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// Sprite pixel-art (2 frame per tipo)
const SPR = {
  a: [[
    "..1....1..","...1..1...","..111111..",".11.11.11.","1111111111","1.111111.1","1.1....1.1","...11.11.."],[
    "..1....1..","1..1..1..1","1.111111.1","111.11.111","1111111111",".11111111.","..1....1..",".1......1."]],
  b: [[
    "...1111...",".11111111.","1111111111","11..11..11","1111111111","..11..11..",".11.11.11.","11......11"],[
    "...1111...",".11111111.","1111111111","11..11..11","1111111111","...1111...",".11....11.","..11..11.."]],
  c: [[
    "....11....","...1111...","..111111..",".11.11.11.","1111111111","..1.11.1..",".1......1.","..1....1.."],[
    "....11....","...1111...","..111111..",".11.11.11.","1111111111",".1.1111.1.","1........1",".1......1."]],
  p: [[
    "....11....","...1111...","..111111..",".11111111.","1111111111","1111111111"]]
};
const COL = {a:"#6f6", b:"#4cf", c:"#f6c", p:"#ff6", u:"#fa4"};
function drawSprite(rows, x, y, s, color){
  ctx.fillStyle = color;
  for(let r=0;r<rows.length;r++) for(let q=0;q<rows[r].length;q++)
    if(rows[r][q]==="1") ctx.fillRect(Math.round(x+q*s), Math.round(y+r*s), s, s);
}

let st; // stato
function reset(full=true){
  if(full){ st = {score:0, lives:3, level:1, hi:+(localStorage.getItem('si_hi')||0)}; }
  st.player = {x:W/2-15, y:H-40, w:30, h:14, cd:0};
  st.bullets = []; st.bombs = []; st.parts = [];
  st.dir = 1; st.tick = 0; st.frame = 0; st.over = false; st.paused = false; st.ufo = null; st.ufoT = 600;
  st.shields = [];
  for(let i=0;i<4;i++){
    const bx = 36 + i*80, by = H-110;
    for(let r=0;r<4;r++) for(let q=0;q<9;q++){
      if(r===3 && q>=3 && q<=5) continue;
      st.shields.push({x:bx+q*5, y:by+r*5, hp:3});
    }
  }
  spawnWave();
}
function spawnWave(){
  st.inv = [];
  const rows = ['c','b','b','a','a'];
  for(let r=0;r<5;r++) for(let c=0;c<10;c++)
    st.inv.push({x:20+c*30, y:50+r*28+Math.min(st.level-1,5)*8, t:rows[r], alive:true});
  st.speedBase = Math.max(8, 30 - (st.level-1)*3);
}

const keys = {};
addEventListener('keydown', e => {
  if(['ArrowLeft','ArrowRight','Space',' '].includes(e.key)||e.code==='Space') e.preventDefault();
  keys[e.code] = true;
  if(e.code==='KeyP' && !st.over) st.paused = !st.paused;
  if(e.code==='Enter' && st.over) reset(true);
});
addEventListener('keyup', e => keys[e.code] = false);
function hold(id, code){
  const b = document.getElementById(id);
  const on = e => {e.preventDefault(); keys[code]=true;}, off = e => {e.preventDefault(); keys[code]=false;};
  b.addEventListener('touchstart', on); b.addEventListener('touchend', off); b.addEventListener('touchcancel', off);
  b.addEventListener('mousedown', on); b.addEventListener('mouseup', off); b.addEventListener('mouseleave', off);
}
hold('bl','ArrowLeft'); hold('br','ArrowRight'); hold('bf','Space');
cv.addEventListener('click', () => { if(st.over) reset(true); });

// Audio minimale
let ac;
function beep(f, d=0.08, type='square', v=0.04){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v;
    o.connect(g); g.connect(ac.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+d); o.stop(ac.currentTime+d);
  }catch(e){}
}
function boom(x,y,color){ for(let i=0;i<12;i++) st.parts.push({x,y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,l:20,c:color}); }

function hit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function update(){
  if(st.over||st.paused) return;
  const p = st.player;
  if(keys.ArrowLeft||keys.KeyA) p.x -= 3;
  if(keys.ArrowRight||keys.KeyD) p.x += 3;
  p.x = Math.max(4, Math.min(W-p.w-4, p.x));
  if(p.cd>0) p.cd--;
  if((keys.Space||keys.ArrowUp) && p.cd===0 && st.bullets.length<2){
    st.bullets.push({x:p.x+p.w/2-1, y:p.y-8, w:2, h:8}); p.cd=18; beep(880,0.06);
  }
  st.bullets.forEach(b => b.y -= 7);
  st.bullets = st.bullets.filter(b => b.y > -10);

  // Invasori
  const alive = st.inv.filter(i=>i.alive);
  if(alive.length===0){ st.level++; st.bullets=[]; st.bombs=[]; spawnWave(); return; }
  const interval = Math.max(2, Math.round(st.speedBase * alive.length/50));
  st.tick++;
  if(st.tick >= interval){
    st.tick = 0; st.frame ^= 1;
    let minX=1e9,maxX=-1e9;
    alive.forEach(i=>{minX=Math.min(minX,i.x);maxX=Math.max(maxX,i.x+20);});
    let drop=false;
    if((st.dir>0 && maxX+8>W-6)||(st.dir<0 && minX-8<6)){ st.dir*=-1; drop=true; }
    alive.forEach(i=>{ if(drop) i.y+=12; else i.x+=8*st.dir; });
    beep(110 + (st.frame?20:0), 0.05, 'square', 0.05);
  }
  // Bombe
  if(Math.random() < 0.012 + st.level*0.002){
    const cols = {};
    alive.forEach(i=>{ const k=Math.round(i.x); if(!cols[k]||cols[k].y<i.y) cols[k]=i; });
    const arr = Object.values(cols), s = arr[Math.floor(Math.random()*arr.length)];
    if(s) st.bombs.push({x:s.x+9, y:s.y+16, w:3, h:8});
  }
  st.bombs.forEach(b=>b.y+=2.5+st.level*0.15);
  st.bombs = st.bombs.filter(b=>b.y<H);

  // UFO
  if(!st.ufo && --st.ufoT<=0){ st.ufo={x:-30,y:30,w:28,h:12,v:1.5}; st.ufoT=900+Math.random()*600; }
  if(st.ufo){ st.ufo.x += st.ufo.v; if(st.ufo.x>W+30) st.ufo=null; }

  // Collisioni proiettili
  for(const b of st.bullets){
    for(const i of alive){
      if(i.alive && hit(b,{x:i.x,y:i.y,w:20,h:16})){
        i.alive=false; b.y=-99;
        st.score += i.t==='c'?30:i.t==='b'?20:10;
        boom(i.x+10,i.y+8,COL[i.t]); beep(200,0.12,'sawtooth');
      }
    }
    if(st.ufo && hit(b,st.ufo)){ st.score += [50,100,150,300][Math.floor(Math.random()*4)]; boom(st.ufo.x+14,st.ufo.y+6,COL.u); st.ufo=null; b.y=-99; beep(400,0.3,'sawtooth'); }
  }
  // Scudi
  for(const arr of [st.bullets, st.bombs]){
    for(const b of arr){
      for(const s of st.shields){
        if(s.hp>0 && hit(b,{x:s.x,y:s.y,w:5,h:5})){ s.hp--; b.y = arr===st.bullets?-99:H+99; break; }
      }
    }
  }
  for(const i of alive) for(const s of st.shields) if(s.hp>0 && i.alive && hit({x:i.x,y:i.y,w:20,h:16},{x:s.x,y:s.y,w:5,h:5})) s.hp=0;
  st.shields = st.shields.filter(s=>s.hp>0);
  // Giocatore colpito
  for(const b of st.bombs){
    if(hit(b,p)){
      b.y=H+99; st.lives--; boom(p.x+15,p.y+7,'#fff'); beep(80,0.4,'sawtooth',0.08);
      p.x = W/2-15;
      if(st.lives<=0) gameOver();
    }
  }
  // Invasione
  if(alive.some(i=>i.y+16>=p.y)) { st.lives=0; gameOver(); }

  st.parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.l--;});
  st.parts = st.parts.filter(q=>q.l>0);
  st.bullets = st.bullets.filter(b=>b.y>-50);
  st.bombs = st.bombs.filter(b=>b.y<H+50);
}
function gameOver(){
  st.over = true;
  if(st.score>st.hi){ st.hi=st.score; try{localStorage.setItem('si_hi',st.hi);}catch(e){} }
}

function draw(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  ctx.font='14px "Courier New"'; ctx.textAlign='left';
  ctx.fillStyle='#fff'; ctx.fillText('PUNTI '+String(st.score).padStart(5,'0'),8,18);
  ctx.textAlign='center'; ctx.fillText('RECORD '+String(Math.max(st.hi,st.score)).padStart(5,'0'),W/2+20,18);
  ctx.textAlign='right'; ctx.fillText('LIV '+st.level,W-8,18);
  // Vite
  ctx.textAlign='left'; ctx.fillStyle='#9f9';
  for(let i=0;i<st.lives-1;i++) drawSprite(SPR.p[0], 8+i*26, H-14, 2, '#9f9');
  ctx.fillStyle='#1a3'; ctx.fillRect(0,H-20,W,1);

  for(const i of st.inv) if(i.alive) drawSprite(SPR[i.t][st.frame], i.x, i.y, 2, COL[i.t]);
  for(const s of st.shields){ ctx.fillStyle = s.hp===3?'#3c3':s.hp===2?'#2a2':'#161'; ctx.fillRect(s.x,s.y,5,5); }
  const p = st.player;
  drawSprite(SPR.p[0], p.x, p.y, 3, '#9f9');
  ctx.fillStyle='#fff'; st.bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
  ctx.fillStyle='#f55'; st.bombs.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
  if(st.ufo){ ctx.fillStyle=COL.u; ctx.fillRect(st.ufo.x+6,st.ufo.y,16,5); ctx.fillRect(st.ufo.x,st.ufo.y+5,28,5); ctx.fillStyle='#000'; for(let k=0;k<4;k++) ctx.fillRect(st.ufo.x+4+k*7,st.ufo.y+6,3,2); }
  st.parts.forEach(q=>{ctx.fillStyle=q.c;ctx.globalAlpha=q.l/20;ctx.fillRect(q.x,q.y,2,2);}); ctx.globalAlpha=1;

  if(st.paused||st.over){
    ctx.fillStyle='rgba(0,0,0,.65)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='bold 28px "Courier New"';
    ctx.fillText(st.over?'GAME OVER':'PAUSA',W/2,H/2-10);
    ctx.font='14px "Courier New"';
    if(st.over){ ctx.fillText('Punteggio: '+st.score,W/2,H/2+16); ctx.fillText('INVIO o tocca per rigiocare',W/2,H/2+40); }
  }
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
reset(true); loop();
})();
</script>
</body>
</html>
